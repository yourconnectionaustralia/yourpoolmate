# Weekly pull requests for out-of-date npm packages and GitHub Actions.
# The actions in .github/workflows are pinned to commit SHAs, and Dependabot
# updates those pins too.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    ignore:
      # react and react-dom must move together, and a major version needs a deliberate
      # upgrade with a test run. A lone react-dom 19 bump broke every install.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
