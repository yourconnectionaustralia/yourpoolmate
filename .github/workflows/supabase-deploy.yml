# Deploys Supabase edge functions automatically on push to main.
# MIGRATIONS DO NOT RUN ON PUSH — they run only on a manual workflow_dispatch
# (see the `if:` guard on the "Apply new migrations" step below). A push to
# main redeploys the edge functions; a human must click "Run workflow" to
# apply any migration against production.
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN — personal access token (supabase.com/dashboard/account/tokens)
#   ANTHROPIC_API_KEY     — for the ocr-water-test function (set as a Supabase secret)
#   RESEND_API_KEY        — Resend API key for L1–L7 (set as a Supabase secret)
#   EMAIL_ALLOWLIST       — optional comma-separated extra recipients. Blank keeps
#                           the code default (yourconnectionaustralia@gmail.com only).
#                           Set the value to * only when live sends are approved.
#   LIFECYCLE_CRON_SECRET — shared bearer for the sweep workflow and manual test sends
name: Deploy Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**', 'scripts/apply_migrations.py', '.github/workflows/supabase-deploy.yml']
  workflow_dispatch:

# The job only reads the repo. Everything it changes goes through the secrets below.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: chmjvbuesynicrmtkrqp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Migrations run ONLY on a manual workflow_dispatch — never on push.
      # (A job can't carry its own trigger, so the gate lives on the step.)
      - name: Apply new migrations
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/apply_migrations.py

      # The action is pinned to a commit and the CLI to an exact release, so a new CLI
      # version can't break the deploy overnight. CLI v3 asks before it changes a hosted
      # project and can't ask in CI, so every deploy and secrets call below passes --yes.
      # To upgrade: change `version`, then run this workflow once by hand.
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0

      - name: Deploy edge functions
        run: |
          supabase functions deploy calculate-health-score --project-ref "$PROJECT_REF" --use-api --yes
          supabase functions deploy ocr-water-test --project-ref "$PROJECT_REF" --use-api --yes
          supabase functions deploy pool-chat --project-ref "$PROJECT_REF" --use-api --yes
          # stripe-checkout is called by signed-in app users → keep JWT verification.
          supabase functions deploy stripe-checkout --project-ref "$PROJECT_REF" --use-api --yes
          # stripe-webhook is called by Stripe (no Supabase JWT) → verify by signature instead.
          supabase functions deploy stripe-webhook --project-ref "$PROJECT_REF" --use-api --no-verify-jwt --yes
          # send-lifecycle-email is called by the sweep workflow (no user JWT).
          # delete-account is called by signed-in app users → keep JWT verification.
          supabase functions deploy delete-account --project-ref "$PROJECT_REF" --use-api --yes
          supabase functions deploy send-lifecycle-email --project-ref "$PROJECT_REF" --use-api --no-verify-jwt --yes

      - name: Set OCR secret (skipped if not configured)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$PROJECT_REF" --yes
          else
            echo "::warning::ANTHROPIC_API_KEY repo secret not set — OCR function will return NOT_CONFIGURED"
          fi

      - name: Set Stripe secrets (skipped if not configured)
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          # Catalog Price IDs. Same secret names in test and live; values differ.
          # While STRIPE_SECRET_KEY is sk_test_…, set the test-mode Price IDs.
          # Blank keeps the inline price_data fallback inside stripe-checkout.
          STRIPE_PRICE_FOUNDING: ${{ secrets.STRIPE_PRICE_FOUNDING }}
          STRIPE_PRICE_ANNUAL: ${{ secrets.STRIPE_PRICE_ANNUAL }}
        run: |
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            supabase secrets set STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" --project-ref "$PROJECT_REF" --yes
          else
            echo "::warning::STRIPE_SECRET_KEY repo secret not set — checkout will return NOT_CONFIGURED"
          fi
          if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then
            supabase secrets set STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" --project-ref "$PROJECT_REF" --yes
          else
            echo "::warning::STRIPE_WEBHOOK_SECRET repo secret not set — webhook will reject all events"
          fi
          if [ -n "$STRIPE_PRICE_FOUNDING" ]; then
            supabase secrets set STRIPE_PRICE_FOUNDING="$STRIPE_PRICE_FOUNDING" --project-ref "$PROJECT_REF" --yes
          else
            echo "::warning::STRIPE_PRICE_FOUNDING repo secret not set — founding checkout will use inline price_data"
          fi
          if [ -n "$STRIPE_PRICE_ANNUAL" ]; then
            supabase secrets set STRIPE_PRICE_ANNUAL="$STRIPE_PRICE_ANNUAL" --project-ref "$PROJECT_REF" --yes
          else
            echo "::warning::STRIPE_PRICE_ANNUAL repo secret not set — annual checkout will use inline price_data"
          fi

      - name: Set lifecycle email secrets (skipped if not configured)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_ALLOWLIST: ${{ secrets.EMAIL_ALLOWLIST }}
          LIFECYCLE_CRON_SECRET: ${{ secrets.LIFECYCLE_CRON_SECRET }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            supabase secrets set RESEND_API_KEY="$RESEND_API_KEY" --project-ref "$PROJECT_REF" --yes
          else
            echo "::warning::RESEND_API_KEY repo secret not set — lifecycle mail will not call Resend"
          fi
          if [ -n "$EMAIL_ALLOWLIST" ]; then
            supabase secrets set EMAIL_ALLOWLIST="$EMAIL_ALLOWLIST" --project-ref "$PROJECT_REF" --yes
          else
            echo "::warning::EMAIL_ALLOWLIST repo secret not set — edge function keeps the default inbox only (yourconnectionaustralia@gmail.com)"
          fi
          if [ -n "$LIFECYCLE_CRON_SECRET" ]; then
            supabase secrets set LIFECYCLE_CRON_SECRET="$LIFECYCLE_CRON_SECRET" --project-ref "$PROJECT_REF" --yes
          else
            echo "::warning::LIFECYCLE_CRON_SECRET repo secret not set — sweep and manual sends will return 503"
          fi
