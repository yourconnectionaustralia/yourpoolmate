# Deploys Supabase edge functions automatically on push to main.
# MIGRATIONS DO NOT RUN ON PUSH — they run only on a manual workflow_dispatch
# (see the `if:` guard on the "Apply new migrations" step below). A push to
# main redeploys the edge functions; a human must click "Run workflow" to
# apply any migration against production.
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN — personal access token (supabase.com/dashboard/account/tokens)
#   ANTHROPIC_API_KEY     — for the ocr-water-test function (set as a Supabase secret)
name: Deploy Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**', 'scripts/apply_migrations.py', '.github/workflows/supabase-deploy.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: chmjvbuesynicrmtkrqp
    steps:
      - uses: actions/checkout@v5

      # Migrations run ONLY on a manual workflow_dispatch — never on push.
      # (A job can't carry its own trigger, so the gate lives on the step.)
      - name: Apply new migrations
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/apply_migrations.py

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        run: |
          supabase functions deploy calculate-health-score --project-ref "$PROJECT_REF" --use-api
          supabase functions deploy ocr-water-test --project-ref "$PROJECT_REF" --use-api
          # stripe-checkout is called by signed-in app users → keep JWT verification.
          supabase functions deploy stripe-checkout --project-ref "$PROJECT_REF" --use-api
          # stripe-webhook is called by Stripe (no Supabase JWT) → verify by signature instead.
          supabase functions deploy stripe-webhook --project-ref "$PROJECT_REF" --use-api --no-verify-jwt

      - name: Set OCR secret (skipped if not configured)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$PROJECT_REF"
          else
            echo "::warning::ANTHROPIC_API_KEY repo secret not set — OCR function will return NOT_CONFIGURED"
          fi

      - name: Set Stripe secrets (skipped if not configured)
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          # Catalog Price IDs. Same secret names in test and live; values differ.
          # While STRIPE_SECRET_KEY is sk_test_…, set the test-mode Price IDs.
          # Blank keeps the inline price_data fallback inside stripe-checkout.
          STRIPE_PRICE_FOUNDING: ${{ secrets.STRIPE_PRICE_FOUNDING }}
          STRIPE_PRICE_ANNUAL: ${{ secrets.STRIPE_PRICE_ANNUAL }}
        run: |
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            supabase secrets set STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" --project-ref "$PROJECT_REF"
          else
            echo "::warning::STRIPE_SECRET_KEY repo secret not set — checkout will return NOT_CONFIGURED"
          fi
          if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then
            supabase secrets set STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" --project-ref "$PROJECT_REF"
          else
            echo "::warning::STRIPE_WEBHOOK_SECRET repo secret not set — webhook will reject all events"
          fi
          if [ -n "$STRIPE_PRICE_FOUNDING" ]; then
            supabase secrets set STRIPE_PRICE_FOUNDING="$STRIPE_PRICE_FOUNDING" --project-ref "$PROJECT_REF"
          else
            echo "::warning::STRIPE_PRICE_FOUNDING repo secret not set — founding checkout will use inline price_data"
          fi
          if [ -n "$STRIPE_PRICE_ANNUAL" ]; then
            supabase secrets set STRIPE_PRICE_ANNUAL="$STRIPE_PRICE_ANNUAL" --project-ref "$PROJECT_REF"
          else
            echo "::warning::STRIPE_PRICE_ANNUAL repo secret not set — annual checkout will use inline price_data"
          fi
